name: GLaDOS Auto Checkin

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: "0 20 * * *" # 每日 UTC 20:00 签到（北京时间次日 4:00）
    
jobs:
  checkin:
    name: GLaDOS 签到
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: glados-checkin
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: checkin.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "requests==2.32.3" --no-cache-dir

      - name: Run checkin.py
        run: python checkin.py
        env:
          COOKIES: ${{ secrets.COOKIES }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}