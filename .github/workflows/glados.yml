name: GLaDOS Auto Checkin

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: "0 20 * * *" # 每日 UTC 20:00 签到（北京时间次日 4:00）
    - cron: "0 0 1 * *" # 每月 1 号保活空提交

jobs:
  # 每个任务独立运行
  checkin:
    name: GLaDOS 签到
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' || github.event.schedule != '0 0 1 * *'
    concurrency:
      group: glados-checkin
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # 将checkin.py下载到actions中进行运行
          sparse-checkout: checkin.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "requests==2.32.3" --no-cache-dir

      - name: Run checkin.py
        run: python checkin.py
        env:
          COOKIES: ${{ secrets.COOKIES }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}

  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    
    steps:
      - name: Delete runs older than 7 days
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const daysToKeep = 7;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysToKeep);
            
            console.log(`保留 ${cutoffDate.toISOString()} 之后的运行记录`);
            
            // 获取所有工作流
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            let totalDeleted = 0;
            
            for (const workflow of workflows.data.workflows) {
              console.log(`处理工作流: ${workflow.name}`);
              
              // 获取该工作流的所有运行记录
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                per_page: 100,
              });
              
              let deleted = 0;
              
              for (const run of runs.data.workflow_runs) {
                const runDate = new Date(run.created_at);
                
                // 如果运行时间超过7天，删除
                if (runDate < cutoffDate) {
                  console.log(`  删除: ${run.name} (ID: ${run.id}, 创建于: ${run.created_at})`);
                  
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  
                  deleted++;
                  totalDeleted++;
                  
                  // 避免 API 速率限制，稍微延迟
                  await new Promise(resolve => setTimeout(resolve, 100));
                }
              }
              
              console.log(`  删除了 ${deleted} 条记录`);
            }
            
            console.log(`✅ 总共删除了 ${totalDeleted} 条运行记录`);

  keepalive:
    name: 每个月初创建空提交保活跃
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: glados-keepalive
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 创建空提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "update"
          git push
