name: Weather Auto Send

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: "00 22 * * *" # 北京时间每天早上6点执行

permissions:
  contents: read

jobs:
  weather_send:
    runs-on: ubuntu-latest
    env:
      # 设置时区
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4
        with:
          # 指定文件导入到actions中进行运行
          sparse-checkout: |
            weather/bell.gif
            weather/weather_template.html
            weather/weather.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run weather.py
        run: python weather/weather.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          WHY_EMAIL: ${{ secrets.WHY_EMAIL }}
          CH_EMAIL: ${{ secrets.CH_EMAIL }}