name: Weather Auto Send

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: "00 22 * * *" # 北京时间每天早上6点执行

permissions:
  contents: read

jobs:
  weather_send:
    runs-on: ubuntu-latest
    env:
      # 设置时区
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4
        with:
          # 指定文件导入到actions中进行运行
          sparse-checkout: |
            weather/bell.gif
            weather/weather_template.html
            weather/weather.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run weather.py
        run: python weather/weather.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          AUTH_CODE: ${{ secrets.AUTH_CODE }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          MYSELF_EMAIL: ${{ secrets.MYSELF_EMAIL }}
          WHY_EMAIL: ${{ secrets.WHY_EMAIL }}
          CH_EMAIL: ${{ secrets.CH_EMAIL }}

  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    
    steps:
      - name: Delete runs older than 7 days
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const daysToKeep = 7;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysToKeep);
            
            console.log(`保留 ${cutoffDate.toISOString()} 之后的运行记录`);
            
            // 获取所有工作流
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            let totalDeleted = 0;
            
            for (const workflow of workflows.data.workflows) {
              console.log(`处理工作流: ${workflow.name}`);
              
              // 获取该工作流的所有运行记录
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                per_page: 100,
              });
              
              let deleted = 0;
              
              for (const run of runs.data.workflow_runs) {
                const runDate = new Date(run.created_at);
                
                // 如果运行时间超过7天，删除
                if (runDate < cutoffDate) {
                  console.log(`  删除: ${run.name} (ID: ${run.id}, 创建于: ${run.created_at})`);
                  
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  
                  deleted++;
                  totalDeleted++;
                  
                  // 避免 API 速率限制，稍微延迟
                  await new Promise(resolve => setTimeout(resolve, 100));
                }
              }
              
              console.log(`  删除了 ${deleted} 条记录`);
            }
            
            console.log(`✅ 总共删除了 ${totalDeleted} 条运行记录`);