<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>每日天气推送</title>
</head>

<body
    style="margin:0;padding:0;background-color:#eef2ff;font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;color:#2d3748;">

    <!-- 外层背景 -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
        style="width:100%;margin:0;padding:0;background-color:#eef2ff;">
        <tr>
            <td align="center" style="padding:24px 12px;">

                <!-- 邮件主体 -->
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"
                    style="width:100%;max-width:480px;background-color:#ffffff;border-collapse:separate;border-spacing:0;border-radius:18px;overflow:hidden;">

                    <!-- 顶部 -->
                    <tr>
                        <td align="center" bgcolor="#667eea" style="padding:14px 14px 14px;background-color:#667eea;">

                            <div style="text-align:center;margin-bottom:4px;">
                                <img src="cid:bell_image" alt="铃铛"
                                    style="display:inline-block;width:50px;height:45px;animation:swing 1.2s ease-in-out infinite;transform-origin:top center;">
                            </div>

                            <div style="font-size:12px;line-height:18px;letter-spacing:3px;color:#e9e7ff;">
                                ✦ DAILY PUSH ✦
                            </div>

                            <div style="font-size:14px;line-height:22px;color:#f4f3ff;margin-top:10px;">
                                📅 {date} , 星期{week}
                            </div>

                            <div style="font-size:20px;line-height:34px;font-weight:bold;color:#ffffff;margin-top:4px;">
                                🏙️ {location}
                            </div>

                        </td>
                    </tr>

                    <!-- 内容 -->
                    <tr>
                        <td style="padding:2px 5px 18px;background-color:#ffffff;">

                            <!-- ===== 天气卡片（紧凑容器，三行，不同背景色，类似SweetNothings风格） ===== -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="width:100%;margin:2px 0 2px;border-collapse:separate;border-spacing:0;border-radius:14px;overflow:hidden;border:1px solid #e8edf5;background-color:#ffffff;">

                                <!-- 第一行：天气 -->
                                <tr>
                                    <td
                                        style="padding:5px 8px;background-color:#eff6ff;border-bottom:1px solid #e2e8f0;">
                                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                            border="0">
                                            <tr>
                                                <td width="40%"
                                                    style="width:40%;font-size:14px;line-height:20px;color:#475569;font-weight:bold;text-align:center;">
                                                    📋 天气 ：
                                                </td>
                                                <td width="60%"
                                                    style="width:60%;font-size:14px;line-height:22px;color:#2563eb;font-weight:bold;padding-left: 15px;">
                                                    {weather_icon} {weather_type}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- 第二行：气温 -->
                                <tr>
                                    <td
                                        style="padding:5px 8px;background-color:#fffbeb;border-bottom:1px solid #e2e8f0;">
                                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                            border="0">
                                            <tr>
                                                <td width="40%"
                                                    style="width:40%;font-size:14px;line-height:20px;color:#475569;font-weight:bold;text-align:center;">
                                                    🌡️ 气温 ：
                                                </td>
                                                <td width="60%"
                                                    style="width:60%;font-size:14px;line-height:22px;color:#d97706;font-weight:bold;padding-left: 15px;">
                                                    {temp}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- 第三行：风向 -->
                                <tr>
                                    <td style="padding:5px 8px;background-color:#ecfdf5;">
                                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                                            border="0">
                                            <tr>
                                                <td width="40%"
                                                    style="width:40%;font-size:14px;line-height:20px;color:#475569;font-weight:bold;text-align:center;">
                                                    💨 风向 ：
                                                </td>
                                                <td width="60%"
                                                    style="width:60%;font-size:14px;line-height:22px;color:#059669;font-weight:bold;padding-left: 15px;">
                                                    {wind}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                            </table>

                            <!-- SweetNothings (与天气卡片风格统一) -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="width:100%;margin:3px 0 3px;">
                                <tr>
                                    <td align="center" bgcolor="#fff0f6"
                                        style="padding:5px 5px;background-color:#fff0f6;border:1px solid #f8dce9;border-radius:14px;">

                                        <div
                                            style="font-size:13px;line-height:20px;color:#e91e63;font-weight:bold;letter-spacing:2px;margin-bottom:6px;font-family: 'Alex Brush', 'Great Vibes', 'Brush Script MT', 'Segoe Script', cursive;text-align:left;">
                                            💝 SweetNothings:
                                        </div>

                                        <div style="font-size:12px;line-height:29px;color:#6a1b9a;font-weight:500;">
                                            {SweetNothings}
                                        </div>

                                    </td>
                                </tr>
                            </table>

                            <!-- 📸 每日图片标题 -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="width:100%;margin:6px 0 4px;">
                                <tr>
                                    <td
                                        style="font-size:14px;line-height:20px;color:#64748b;font-weight:bold;padding:0 4px;">
                                        🕊️ 每日图片：
                                    </td>
                                </tr>
                            </table>

                            <!-- 每日图片 -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="width:100%;margin:0 0 16px;border-collapse:separate;">
                                <tr>
                                    <td align="center" bgcolor="#f7fafc"
                                        style="background-color:#f7fafc;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;">
                                        <img src="cid:daily_image" alt="每日图片" width="432"
                                            style="display:block;width:100%;max-width:432px;height:auto;border:0;outline:none;text-decoration:none;">
                                    </td>
                                </tr>
                            </table>

                            <!-- 更新时间 -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="width:100%;border-top:1px solid #e8edf5;">
                                <tr>
                                    <td align="center"
                                        style="padding:14px 0 4px;font-size:12px;line-height:18px;color:#94a3b8;">
                                        🔄 更新时间：{update}
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- 底部 -->
                    <tr>
                        <td align="center" bgcolor="#f7fafc"
                            style="padding:15px 20px;background-color:#f7fafc;border-top:1px solid #e8edf5;font-size:12px;line-height:18px;color:#94a3b8;">
                            💌 每日天气推送 · 愿你今日好心情
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
